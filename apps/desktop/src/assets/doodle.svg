    <!-- coffee cup -->
    <path d="M262 36h30v14a10 10 0 0 1-10 10h-10a10 10 0 0 1-10-10z"/>
    <path d="M292 40h5a5 5 0 0 1 0 10h-5"/>
    <!-- musical note -->
    <path d="M44 118v34l22-6v-34"/>
    <ellipse cx="38" cy="154" rx="7" ry="5"/>
    <ellipse cx="60" cy="148" rx="7" ry="5"/>
    <!-- camera -->
    <rect x="110" y="116" width="46" height="32" rx="7"/>
    <circle cx="133" cy="132" r="9"/>
    <path d="M118 116l5-8h20l5 8"/>
