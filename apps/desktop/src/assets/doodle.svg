    <circle cx="222" cy="132" r="13"/>
    <path d="M222 124v9l6 4"/>
    <!-- paper plane -->
    <path d="M264 112l30 12-30 12 6-12z"/>
    <path d="M270 124h12"/>
    <!-- flower -->
    <circle cx="62" cy="222" r="6"/>
    <path d="M62 216c-6-8 2-16 8-10-2-10 8-14 12-6 4-8 14-4 12 6 6-6 14 2 8 10 6 6-2 14-8 10 2 10-8 14-12 6-4 8-14 4-12-6-6 6-14-2-8-10z"/>
    <!-- smiley -->
    <circle cx="140" cy="226" r="15"/>
    <path d="M134 222h.5M146 222h.5M133 232c4 4 10 4 14 0"/>
    <!-- lightning -->
    <path d="M216 208l-10 18h9l-6 16 16-20h-9l6-14z"/>
