[package]
name = "rustwa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "RustWA desktop host — Tauri shell for the Rust WhatsApp client"

[lib]
name = "rustwa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The `tray-icon` feature powers the menu bar extra; `image-png` is not needed
# because the tray glyph is generated in code as raw RGBA.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
# Native open/save dialogs; powers the attachment menu's file pickers.
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# The `deep-link` feature hands forwarded CLI arguments (second app instance on
# Windows/Linux) to `tauri-plugin-deep-link` before running our callback.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
whatsapp-core = { path = "../../../crates/whatsapp-core", features = ["calls"] }

# macOS-only framework bindings.
# - App lock (M8): LocalAuthentication powers the Touch ID / Mac password
#   prompt. Other platforms get the stub in `security.rs`.
# - Notification click-through: posting through `UNUserNotificationCenter`
#   and receiving delegate callbacks requires direct framework bindings; the
#   notification plugin's backend cannot carry `userInfo`.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString"] }
objc2-local-authentication = "0.3"
objc2-user-notifications = "0.3"

[lints]
workspace = true
